  <title id="ttl">frootlab</title>
  <desc id="desc">Reversed version of the frootlab lockup for dark backgrounds. The wordmark and the dark rule segments are white; the gold segments and the red node are unchanged. The background is transparent, so this file looks blank in a white viewer.</desc>
